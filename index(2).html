<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALControl</title>

<!-- Biblioteca para lectura de códigos QR -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    max-width: 500px;
    margin: auto;
    min-height: 100vh;
    background: #050505;
}

header {
    height: 65px;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.menu-btn {
    background: transparent;
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

main {
    padding: 18px;
}

.card {
    background: #111;
    border: 1px solid #2c2c2c;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
    color: #bbb;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #050505;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #fff;
    color: #000;
}

.secondary {
    background: #242424;
    color: #fff;
    border: 1px solid #444;
}

.ok {
    background: #18a957;
    color: white;
    font-size: 22px;
}

.alert {
    background: #d62828;
    color: white;
    font-size: 22px;
}

.back {
    background: #202020;
    color: white;
}

.danger {
    background: #7c1d1d;
    color: white;
}

.worker-name {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.worker-run {
    font-size: 18px;
    color: #aaa;
}

.result-box {
    text-align: center;
    padding: 20px 0;
}

.history-item,
.worker-item {
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    background: #0c0c0c;
}

.history-ok {
    color: #38d878;
    font-weight: bold;
}

.history-alert {
    color: #ff4b4b;
    font-weight: bold;
}

.small {
    font-size: 13px;
    color: #888;
}

.hidden {
    display: none !important;
}

.menu {
    position: absolute;
    right: 15px;
    top: 58px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    width: 210px;
    z-index: 1000;
    overflow: hidden;
}

.menu button {
    margin: 0;
    border-radius: 0;
    text-align: left;
    background: #181818;
    border-bottom: 1px solid #333;
}

.menu button:hover {
    background: #292929;
}

/* Lector QR */

#qr-reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

.camera-info {
    text-align: center;
    color: #aaa;
    margin-bottom: 12px;
    font-size: 14px;
}

.scan-success {
    color: #38d878;
    text-align: center;
    font-weight: bold;
    margin-top: 10px;
}

</style>
</head>

<body>

<div class="app">

<header>
    <h1>ALControl</h1>

    <button class="menu-btn" onclick="toggleMenu()">⋮</button>

    <div id="menu" class="menu hidden">

        <button onclick="mostrarCaptura()">
            📋 Captura
        </button>

        <button onclick="mostrarTrabajadores()">
            👷 Trabajadores
        </button>

        <button onclick="mostrarHistorial()">
            📊 Ver historial
        </button>

        <button onclick="cambiarUsuario()">
            👤 Cambiar usuario
        </button>

    </div>
</header>

<main>

<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<section id="pantallaUsuario">

<div class="card">

<h2>Ingreso</h2>

<label>Usuario</label>

<input
    id="usuarioInput"
    type="text"
    placeholder="Ingrese usuario"
>

<label>Equipo de control</label>

<input
    id="equipoInput"
    type="text"
    placeholder="Opcional"
>

<label>Fecha de calibración</label>

<input
    id="calibracionInput"
    type="date"
>

<button class="primary" onclick="ingresar()">
    INGRESAR
</button>

</div>

</section>


<!-- ========================= -->
<!-- CAPTURA -->
<!-- ========================= -->

<section id="pantallaCaptura" class="hidden">

<div class="card">

<h2>Identificar trabajador</h2>

<p class="small">
Escanee la cédula o busque manualmente al trabajador.
</p>

<button class="primary" onclick="abrirScanner()">
    📷 ESCANEAR CÉDULA
</button>

<button class="secondary" onclick="simularNFC()">
    📡 SIMULAR NFC
</button>

<button class="secondary" onclick="mostrarBusqueda()">
    🔎 BUSCAR TRABAJADOR
</button>

<button class="secondary" onclick="mostrarNuevoTrabajador()">
    ＋ NUEVO TRABAJADOR
</button>

</div>

</section>


<!-- ========================= -->
<!-- SCANNER QR -->
<!-- ========================= -->

<section id="pantallaScanner" class="hidden">

<div class="card">

<h2>Escanear cédula</h2>

<div class="camera-info">
Apunta la cámara al código QR de la cédula.
</div>

<div id="qr-reader"></div>

<button class="back" onclick="cerrarScanner()">
    ← CANCELAR
</button>

<div id="scannerMensaje"></div>

</div>

</section>


<!-- ========================= -->
<!-- BUSCAR -->
<!-- ========================= -->

<section id="pantallaBusqueda" class="hidden">

<div class="card">

<h2>Buscar trabajador</h2>

<input
    id="busquedaInput"
    type="text"
    placeholder="RUN o nombre"
    oninput="buscarTrabajadores()"
>

<div id="resultadosBusqueda"></div>

<button class="back" onclick="mostrarCaptura()">
    ← VOLVER
</button>

</div>

</section>


<!-- ========================= -->
<!-- NUEVO TRABAJADOR -->
<!-- ========================= -->

<section id="pantallaNuevoTrabajador" class="hidden">

<div class="card">

<h2>Nuevo trabajador</h2>

<label>RUN</label>

<input
    id="nuevoRun"
    type="text"
    placeholder="12345678-9"
>

<label>Nombre</label>

<input
    id="nuevoNombre"
    type="text"
    placeholder="Nombre"
>

<label>Apellido</label>

<input
    id="nuevoApellido"
    type="text"
    placeholder="Apellido"
>

<label>Estado</label>

<select id="nuevoEstado">

<option value="ACTIVO">
    ACTIVO
</option>

<option value="INACTIVO">
    INACTIVO
</option>

</select>

<button class="primary" onclick="crearTrabajador()">
    GUARDAR TRABAJADOR
</button>

<button class="back" onclick="mostrarCaptura()">
    ← VOLVER
</button>

</div>

</section>


<!-- ========================= -->
<!-- TRABAJADORES -->
<!-- ========================= -->

<section id="pantallaTrabajadores" class="hidden">

<div class="card">

<h2>Trabajadores</h2>

<div id="listaTrabajadores"></div>

<button class="primary" onclick="mostrarNuevoTrabajador()">
    ＋ NUEVO TRABAJADOR
</button>

<button class="back" onclick="mostrarCaptura()">
    ← VOLVER
</button>

</div>

</section>


<!-- ========================= -->
<!-- RESULTADO -->
<!-- ========================= -->

<section id="pantallaResultado" class="hidden">

<div class="card">

<h2>Resultado</h2>

<div class="result-box">

<div
    id="resultadoNombre"
    class="worker-name">
</div>

<div
    id="resultadoRun"
    class="worker-run">
</div>

</div>

<button class="ok" onclick="guardarOK()">
    ✓ OK
</button>

<button class="alert" onclick="mostrarAlerta()">
    ! ALERTA
</button>

</div>

</section>


<!-- ========================= -->
<!-- ALERTA -->
<!-- ========================= -->

<section id="pantallaAlerta" class="hidden">

<div class="card">

<h2>Registrar alerta</h2>

<div
    id="alertaNombre"
    class="worker-name">
</div>

<div
    id="alertaRun"
    class="worker-run">
</div>

<label>Lectura del equipo</label>

<input
    id="lecturaAlerta"
    type="text"
    placeholder="Ej: 0,10 mg/L"
>

<label>Observación</label>

<input
    id="observacionAlerta"
    type="text"
    placeholder="Opcional"
>

<button class="alert" onclick="guardarAlerta()">
    GUARDAR ALERTA
</button>

<button class="back" onclick="mostrarResultado()">
    ← VOLVER
</button>

</div>

</section>


<!-- ========================= -->
<!-- HISTORIAL -->
<!-- ========================= -->

<section id="pantallaHistorial" class="hidden">

<div class="card">

<h2>Historial</h2>

<label>Buscar trabajador</label>

<input
    id="filtroTrabajador"
    type="text"
    placeholder="Nombre o RUN"
    oninput="mostrarHistorial()"
>

<label>Resultado</label>

<select
    id="filtroResultado"
    onchange="mostrarHistorial()">

<option value="TODOS">
    TODOS
</option>

<option value="OK">
    OK
</option>

<option value="ALERTA">
    ALERTA
</option>

</select>

<br><br>

<div id="listaHistorial"></div>

<button class="back" onclick="mostrarCaptura()">
    ← VOLVER
</button>

</div>

</section>

</main>

</div>


<script>

/* ================================================= */
/* VARIABLES */
/* ================================================= */

let usuarioActual = null;
let equipoActual = "";
let calibracionActual = "";

let trabajadorSeleccionado = null;

let qrScanner = null;


/* ================================================= */
/* STORAGE */
/* ================================================= */

function obtenerTrabajadores() {

    return JSON.parse(
        localStorage.getItem("alcontrol_trabajadores") || "[]"
    );

}


function guardarTrabajadores(lista) {

    localStorage.setItem(
        "alcontrol_trabajadores",
        JSON.stringify(lista)
    );

}


function obtenerControles() {

    return JSON.parse(
        localStorage.getItem("alcontrol_controles") || "[]"
    );

}


function guardarControles(lista) {

    localStorage.setItem(
        "alcontrol_controles",
        JSON.stringify(lista)
    );

}


/* ================================================= */
/* UTILIDADES */
/* ================================================= */

function ocultarTodo() {

    const pantallas = [
        "pantallaUsuario",
        "pantallaCaptura",
        "pantallaScanner",
        "pantallaBusqueda",
        "pantallaNuevoTrabajador",
        "pantallaTrabajadores",
        "pantallaResultado",
        "pantallaAlerta",
        "pantallaHistorial"
    ];

    pantallas.forEach(id => {

        document
            .getElementById(id)
            .classList.add("hidden");

    });

}


function cerrarMenu() {

    document
        .getElementById("menu")
        .classList.add("hidden");

}


function toggleMenu() {

    document
        .getElementById("menu")
        .classList.toggle("hidden");

}


function mostrarCaptura() {

    cerrarScanner();

    cerrarMenu();

    ocultarTodo();

    document
        .getElementById("pantallaCaptura")
        .classList.remove("hidden");

}


function normalizarRun(run) {

    if (!run) return "";

    return run
        .toString()
        .trim()
        .toUpperCase()
        .replace(/\./g, "")
        .replace(/\s/g, "");

}


/* ================================================= */
/* LOGIN */
/* ================================================= */

function ingresar() {

    const usuario =
        document
        .getElementById("usuarioInput")
        .value
        .trim();

    if (!usuario) {

        alert("Ingrese el usuario.");

        return;

    }

    usuarioActual = usuario;

    equipoActual =
        document
        .getElementById("equipoInput")
        .value
        .trim();

    calibracionActual =
        document
        .getElementById("calibracionInput")
        .value;

    localStorage.setItem(
        "alcontrol_sesion",
        JSON.stringify({
            usuario: usuarioActual,
            equipo: equipoActual,
            calibracion: calibracionActual
        })
    );

    mostrarCaptura();

}


/* ================================================= */
/* RECUPERAR SESIÓN */
/* ================================================= */

function cargarSesion() {

    const sesion =
        JSON.parse(
            localStorage.getItem("alcontrol_sesion") || "null"
        );

    if (!sesion) return;

    usuarioActual = sesion.usuario;

    equipoActual = sesion.equipo || "";

    calibracionActual =
        sesion.calibracion || "";

    mostrarCaptura();

}


/* ================================================= */
/* CAMBIAR USUARIO */
/* ================================================= */

function cambiarUsuario() {

    cerrarMenu();

    localStorage.removeItem("alcontrol_sesion");

    usuarioActual = null;

    ocultarTodo();

    document
        .getElementById("pantallaUsuario")
        .classList.remove("hidden");

}


/* ================================================= */
/* SELECCIONAR TRABAJADOR */
/* ================================================= */

function seleccionarTrabajador(trabajador, metodo) {

    if (!trabajador) return;

    if (trabajador.estado !== "ACTIVO") {

        alert("El trabajador está INACTIVO.");

        return;

    }

    trabajadorSeleccionado = {
        ...trabajador,
        metodoIdentificacion: metodo || "MANUAL"
    };

    document
        .getElementById("resultadoNombre")
        .textContent =
        trabajador.nombre + " " + trabajador.apellido;

    document
        .getElementById("resultadoRun")
        .textContent =
        "RUN: " + trabajador.run;

    ocultarTodo();

    document
        .getElementById("pantallaResultado")
        .classList.remove("hidden");

}


/* ================================================= */
/* SIMULACIÓN NFC */
/* ================================================= */

function simularNFC() {

    const trabajadores =
        obtenerTrabajadores();

    if (trabajadores.length === 0) {

        alert(
            "No existen trabajadores registrados."
        );

        return;

    }

    const activos =
        trabajadores.filter(
            t => t.estado === "ACTIVO"
        );

    if (activos.length === 0) {

        alert(
            "No existen trabajadores activos."
        );

        return;

    }

    const trabajador =
        activos[0];

    seleccionarTrabajador(
        trabajador,
        "NFC"
    );

}


/* ================================================= */
/* QR - ABRIR CÁMARA */
/* ================================================= */

function abrirScanner() {

    ocultarTodo();

    document
        .getElementById("pantallaScanner")
        .classList.remove("hidden");

    document
        .getElementById("scannerMensaje")
        .innerHTML = "";

    iniciarScanner();

}


/* ================================================= */
/* QR - INICIAR SCANNER */
/* ================================================= */

function iniciarScanner() {

    if (qrScanner) {

        try {

            qrScanner.clear();

        } catch (e) {}

        qrScanner = null;

    }

    qrScanner =
        new Html5Qrcode("qr-reader");

    const config = {

        fps: 10,

        qrbox: {
            width: 250,
            height: 250
        }

    };

    qrScanner
        .start(

            {
                facingMode: "environment"
            },

            config,

            qrDetectado,

            function(errorMessage) {

                // No hacemos nada con errores
                // normales de lectura.

            }

        )
        .catch(function(error) {

            document
                .getElementById("scannerMensaje")
                .innerHTML =
                "<p style='color:#ff5555;text-align:center'>" +
                "No se pudo abrir la cámara.<br><br>" +
                "Revisa que hayas autorizado el acceso a la cámara " +
                "y que ALControl esté funcionando mediante HTTPS." +
                "</p>";

        });

}


/* ================================================= */
/* QR - DETECTADO */
/* ================================================= */

function qrDetectado(decodedText) {

    detenerScanner();

    procesarQR(decodedText);

}


/* ================================================= */
/* QR - PROCESAR */
/* ================================================= */

function procesarQR(textoQR) {

    let run = null;

    try {

        /*
         * El QR de la cédula entrega una URL.
         * Buscamos específicamente el parámetro RUN.
         */

        const url =
            new URL(textoQR);

        run =
            url.searchParams.get("RUN");

    } catch (error) {

        /*
         * Si el contenido no es una URL,
         * intentamos encontrar un RUN directamente.
         */

        const coincidencia =
            textoQR.match(
                /\b\d{7,8}-[\dkK]\b/
            );

        if (coincidencia) {

            run =
                coincidencia[0];

        }

    }

    if (!run) {

        ocultarTodo();

        document
            .getElementById("pantallaCaptura")
            .classList.remove("hidden");

        alert(
            "El QR no contiene un RUN reconocible."
        );

        return;

    }

    run =
        normalizarRun(run);

    buscarTrabajadorPorRUN(
        run,
        "QR"
    );

}


/* ================================================= */
/* BUSCAR POR RUN */
/* ================================================= */

function buscarTrabajadorPorRUN(
    run,
    metodo
) {

    const trabajadores =
        obtenerTrabajadores();

    const trabajador =
        trabajadores.find(
            t =>
            normalizarRun(t.run) ===
            normalizarRun(run)
        );

    if (trabajador) {

        if (trabajador.estado !== "ACTIVO") {

            alert(
                "El trabajador existe, pero está INACTIVO."
            );

            mostrarCaptura();

            return;

        }

        seleccionarTrabajador(
            trabajador,
            metodo
        );

        return;

    }

    /*
     * No existe.
     * Abrimos Nuevo trabajador
     * con RUN precargado.
     */

    mostrarNuevoTrabajador();

    document
        .getElementById("nuevoRun")
        .value = run;

    alert(
        "Trabajador no registrado. Complete sus datos para crearlo."
    );

}


/* ================================================= */
/* CERRAR SCANNER */
/* ================================================= */

function detenerScanner() {

    if (!qrScanner) return;

    try {

        qrScanner
            .stop()
            .then(() => {

                try {

                    qrScanner.clear();

                } catch (e) {}

                qrScanner = null;

            })
            .catch(() => {

                qrScanner = null;

            });

    } catch (e) {

        qrScanner = null;

    }

}


function cerrarScanner() {

    detenerScanner();

    document
        .getElementById("pantallaScanner")
        .classList.add("hidden");

}


/* ================================================= */
/* BUSQUEDA MANUAL */
/* ================================================= */

function mostrarBusqueda() {

    ocultarTodo();

    document
        .getElementById("pantallaBusqueda")
        .classList.remove("hidden");

    document
        .getElementById("busquedaInput")
        .value = "";

    buscarTrabajadores();

}


function buscarTrabajadores() {

    const texto =
        document
        .getElementById("busquedaInput")
        .value
        .toLowerCase()
        .trim();

    const trabajadores =
        obtenerTrabajadores();

    const resultados =
        trabajadores.filter(t => {

            const nombre =
                (
                    t.nombre +
                    " " +
                    t.apellido
                ).toLowerCase();

            const run =
                t.run.toLowerCase();

            return (
                nombre.includes(texto) ||
                run.includes(texto)
            );

        });

    const contenedor =
        document
        .getElementById("resultadosBusqueda");

    contenedor.innerHTML = "";

    if (resultados.length === 0) {

        contenedor.innerHTML =
            "<p class='small'>" +
            "No se encontraron trabajadores." +
            "</p>";

        return;

    }

    resultados.forEach(trabajador => {

        const div =
            document.createElement("div");

        div.className = "worker-item";

        div.innerHTML = `

            <strong>
                ${trabajador.nombre}
                ${trabajador.apellido}
            </strong>

            <br>

            <span class="small">
                RUN: ${trabajador.run}
            </span>

            <br>

            <span class="small">
                Estado: ${trabajador.estado}
            </span>

            <button
                class="secondary"
                onclick="seleccionarTrabajadorPorId(${trabajador.id}, 'MANUAL')">

                SELECCIONAR

            </button>

        `;

        contenedor.appendChild(div);

    });

}


function seleccionarTrabajadorPorId(
    id,
    metodo
) {

    const trabajadores =
        obtenerTrabajadores();

    const trabajador =
        trabajadores.find(
            t => t.id === id
        );

    seleccionarTrabajador(
        trabajador,
        metodo
    );

}


/* ================================================= */
/* NUEVO TRABAJADOR */
/* ================================================= */

function mostrarNuevoTrabajador() {

    ocultarTodo();

    document
        .getElementById("pantallaNuevoTrabajador")
        .classList.remove("hidden");

}


function crearTrabajador() {

    const run =
        normalizarRun(
            document
            .getElementById("nuevoRun")
            .value
        );

    const nombre =
        document
        .getElementById("nuevoNombre")
        .value
        .trim();

    const apellido =
        document
        .getElementById("nuevoApellido")
        .value
        .trim();

    const estado =
        document
        .getElementById("nuevoEstado")
        .value;

    if (!run || !nombre || !apellido) {

        alert(
            "Complete RUN, nombre y apellido."
        );

        return;

    }

    const trabajadores =
        obtenerTrabajadores();

    const existe =
        trabajadores.some(
            t =>
            normalizarRun(t.run) === run
        );

    if (existe) {

        alert(
            "Ese RUN ya está registrado."
        );

        return;

    }

    const trabajador = {

        id: Date.now(),

        run: run,

        nombre: nombre,

        apellido: apellido,

        estado: estado,

        creadoPor: usuarioActual,

        fechaCreacion:
            new Date().toLocaleString()

    };

    trabajadores.push(
        trabajador
    );

    guardarTrabajadores(
        trabajadores
    );

    /*
     * Lo seleccionamos inmediatamente
     * para continuar con el control.
     */

    seleccionarTrabajador(
        trabajador,
        "QR"
    );

}


/* ================================================= */
/* LISTA TRABAJADORES */
/* ================================================= */

function mostrarTrabajadores() {

    cerrarMenu();

    ocultarTodo();

    document
        .getElementById("pantallaTrabajadores")
        .classList.remove("hidden");

    const trabajadores =

/* ================================================= */
/* HISTORIAL */
/* ================================================= */

function mostrarHistorial() {

    cerrarMenu();

    ocultarTodo();

    document
        .getElementById("pantallaHistorial")
        .classList.remove("hidden");

    const controles =
        obtenerControles();

    const texto =
        (
            document
            .getElementById("filtroTrabajador")
            ?.value || ""
        )
        .toLowerCase()
        .trim();

    const resultado =
        document
        .getElementById("filtroResultado")
        ?.value || "TODOS";

    const filtrados =
        controles.filter(control => {

            const coincideTexto =

                control.trabajador
                .toLowerCase()
                .includes(texto)

                ||

                control.run
                .toLowerCase()
                .includes(texto);

            const coincideResultado =

                resultado === "TODOS"

                ||

                control.resultado === resultado;

            return (
                coincideTexto &&
                coincideResultado
            );

        });

    const contenedor =
        document
        .getElementById("listaHistorial");

    contenedor.innerHTML = "";

    if (filtrados.length === 0) {

        contenedor.innerHTML =
            "<p class='small'>" +
            "No existen controles registrados." +
            "</p>";

        return;

    }

    filtrados
        .slice()
        .reverse()
        .forEach(control => {

            const div =
                document.createElement("div");

            div.className =
                "history-item";

            const clase =
                control.resultado === "OK"
                ? "history-ok"
                : "history-alert";

            div.innerHTML = `

                <strong>
                    ${control.trabajador}
                </strong>

                <br>

                <span class="small">
                    RUN: ${control.run}
                </span>

                <br>

                <span class="${clase}">
                    ${control.resultado}
                </span>

                <br>

                <span>
                    Lectura:
                    ${control.lectura}
                </span>

                <br>

                <span class="small">
                    ${control.fecha}
                    ${control.hora}
                </span>

                <br>

                <span class="small">
                    Identificación:
                    ${control.metodo}
                </span>

            `;

            contenedor.appendChild(div);

        });

}
